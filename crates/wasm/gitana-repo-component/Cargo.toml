# NOTE: this crate deliberately does not inherit `[lints] workspace = true`.
# `wit_bindgen::generate!` expands to canonical-ABI lift/lower glue that contains
# `unsafe`, which the workspace-level `unsafe_code = "forbid"` would reject. The
# unsafe is confined to this leaf adapter crate; every gitana core crate keeps
# the workspace forbid.

[package]
name = "gitana-repo-component"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
gitana-repository.workspace = true
wasip2.workspace = true
wit-bindgen.workspace = true
