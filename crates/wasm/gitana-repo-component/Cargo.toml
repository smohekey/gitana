# NOTE: this crate deliberately does not inherit `[lints] workspace = true`.
# `wit_bindgen::generate!` expands to canonical-ABI lift/lower glue that contains
# `unsafe`, which the workspace-level `unsafe_code = "forbid"` would reject. The
# unsafe is confined to this leaf adapter crate; every gitana core crate keeps
# the workspace forbid.

[package]
name = "gitana-repo-component"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow.workspace = true
# gitana-config expands `[include]`/`includeIf` when the component installs the repository's effective
# config (over a `FileStore`-backed resolver). It is I/O-free and wasm-pure (only dep `thiserror`).
gitana-config.workspace = true
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
# gitana-porcelain gives the component the remote composites (fetch/clone/push) over the injected
# transport. Its `reqwest` forwarding is off (default-features = false at the workspace root), so no
# HTTP stack enters the reactor — the network capability is the `wasi:http` import instead.
gitana-porcelain.workspace = true
# gitana-remote provides the `HttpTransport` trait the in-guest `WasiHttpTransport` implements (also
# reqwest-free here).
gitana-remote.workspace = true
gitana-repository.workspace = true
# gitana-worktree gives the component the working-tree porcelain (status/add/checkout/commit) over
# the `DescriptorWorkDir` capability. It is a *direct* dep because the component names its types
# (`WorkTree`, `DescriptorWorkDir`) itself; gitana-porcelain (above) also depends on it and provides
# the `commit` orchestration the component reuses — over a `HostIdentity` adapter that feeds
# porcelain's `Identity` trait the identity lines the host passes in (the component has no env/config).
gitana-worktree.workspace = true
wasip2.workspace = true
wit-bindgen.workspace = true
