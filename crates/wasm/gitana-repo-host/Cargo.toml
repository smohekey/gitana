[package]
name = "gitana-repo-host"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

# The host is native-only (wasmtime does not run inside wasm); all deps are gated so a
# workspace-wide `cargo check --target wasm32-wasip2` compiles this crate to nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
# wasmtime-wasi's `Dir::new` takes the cap-std it was built against (3.x); the gitana
# workspace itself is on cap-std 4.x, so the host names the compatible major under a
# distinct import rather than repointing the workspace dependency.
cap-std-host = { package = "cap-std", version = "3.4" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
# Satisfies the guest's `wasi:http/outgoing-handler` import so the in-component remote porcelain can
# reach a Smart HTTP server. Outbound is host-mediated: the host mints the capability, not the guest.
wasmtime-wasi-http.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# axum + gitana-git-http stand up a loopback Smart-HTTP server (gitana's OWN handlers) as the oracle
# for the remote-porcelain e2e — the same pattern as gta's git_smart_http tests.
axum.workspace = true
cap-std.workspace = true
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-git-http.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
gitana-repository.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
