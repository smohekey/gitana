[package]
edition.workspace = true
license.workspace = true
name = "gitana-remote"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
# The native reqwest-backed `HttpTransport`. On by default so ordinary consumers are unaffected;
# a wasm build (the `gitana:repo` component, via `gitana-porcelain`) turns it off so `reqwest` — a
# browser wasm-bindgen HTTP stack — never enters the wasip2 reactor, and supplies its own transport.
default = ["reqwest-transport"]
reqwest-transport = ["dep:reqwest"]

[dependencies]
anyhow.workspace = true
gitana-config.workspace = true
gitana-file-store.workspace = true
gitana-git-http.workspace = true
gitana-object.workspace = true
gitana-repository.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
gitana-file-store-memory.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
