[package]
description = "In-process management of Git linked worktrees (git worktree)."
edition.workspace = true
license.workspace = true
name = "gitana-linked-worktree"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
[lints]
workspace = true

[dependencies]
gitana-config.workspace = true
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-identity.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
gitana-repository.workspace = true
gitana-repository-layout.workspace = true
gitana-worktree.workspace = true
thiserror.workspace = true

# cap-std mints the filesystem capabilities the inspection functions open from absolute paths. It
# pulls WASI deps that don't build on stable wasm, so keep it native-only; the mint (and the functions
# that use it) are `cfg(not(target_arch = "wasm32"))`-gated, leaving the pure types + classification
# available everywhere. A wasm consumer would inject capabilities instead (a later slice).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std.workspace = true
# The registration lock's contended-retry backoff offloads its sleep with `spawn_blocking` and awaits it,
# so the reactor stays free and a lock *holder* can make progress while a *waiter* backs off (a plain
# `thread::sleep` would stall a same-runtime holder). Native-only: the crate already requires a tokio
# runtime transitively via the file store's own `spawn_blocking`.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# The injected-config tests build a `GitConfig` to hand to `WorktreeContext::with_effective_config`. An
# integration test is its own crate, so it names the type directly rather than through the library's deps.
gitana-config.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
