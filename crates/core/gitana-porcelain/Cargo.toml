[package]
edition.workspace = true
license.workspace = true
name = "gitana-porcelain"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
# Forward `gitana-remote`'s native reqwest transport. On by default so native consumers (gta-core)
# are unaffected; a wasm build turns it off (`--no-default-features`) to keep `reqwest` out of the
# wasip2 reactor and supply its own `HttpTransport`.
default = ["reqwest-transport"]
reqwest-transport = ["gitana-remote/reqwest-transport"]

[dependencies]
anyhow.workspace = true
gitana-config.workspace = true
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-git-http.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
gitana-remote.workspace = true
gitana-repository.workspace = true
gitana-trust.workspace = true
gitana-worktree.workspace = true

[dev-dependencies]
gitana-file-store-local.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# cap-std (used only to build a native `LocalFileStore` in tests) pulls WASI deps that don't
# build on stable; keep it native-only so `--target wasm32-wasip2 --all-targets` stays clean.
# ssh-key (the test `Signer`, which produces real SSHSIG signatures) is native-only for the same reason.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cap-std.workspace = true
ssh-key = { workspace = true, features = ["crypto"] }
