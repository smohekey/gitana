[package]
edition.workspace = true
license.workspace = true
name = "gitana-repository"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
gitana-config.workspace = true
gitana-diff.workspace = true
gitana-file-store.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
gitana-trust.workspace = true
thiserror.workspace = true

# Native ref-lock backoff sleeps on the blocking pool (`spawn_blocking`); wasm is single-process and
# backs off with a cooperative yield instead, so it needs no tokio runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
gitana-file-store-local.workspace = true
gitana-file-store-memory.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# cap-std (used only to build a native `LocalFileStore` in tests) pulls WASI deps that don't
# build on stable; keep it native-only so `--target wasm32-wasip2 --all-targets` stays clean.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cap-std.workspace = true
