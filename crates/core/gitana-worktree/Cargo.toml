[package]
description = "Git index, working-tree scanning, status, add, checkout, and diff support."
edition.workspace = true
license.workspace = true
name = "gitana-worktree"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
[lints]
workspace = true

[dependencies]
gitana-config.workspace = true
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-object.workspace = true
gitana-repository.workspace = true
thiserror.workspace = true

[dev-dependencies]
gitana-object-store.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# cap-std (used only to build a native `LocalFileStore` in tests) pulls WASI deps that don't
# build on stable; keep it native-only so `--target wasm32-wasip2 --all-targets` stays clean.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cap-std.workspace = true
