[package]
edition.workspace = true
license.workspace = true
name = "gta-core"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cap-std.workspace = true
gitana-config.workspace = true
gitana-config-native.workspace = true
gitana-diff.workspace = true
gitana-file-store.workspace = true
gitana-file-store-local.workspace = true
gitana-git-http.workspace = true
gitana-identity.workspace = true
gitana-linked-worktree.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true
gitana-porcelain = { workspace = true, features = ["reqwest-transport"] }
gitana-remote = { workspace = true, features = ["reqwest-transport", "ssh-transport"] }
gitana-repository-layout.workspace = true
gitana-repository.workspace = true
gitana-trust.workspace = true
gitana-worktree.workspace = true
# Terminal credential prompting (git-faithful fallback): `rpassword` reads a password from the TTY
# with echo off, `rprompt` the username line with echo on. Both use raw mode, so `Ctrl-C` is handled
# as input and the terminal is restored — no signal handler, no `unsafe`.
rpassword = "7"
rprompt = "2"
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }

[dev-dependencies]
gitana-file-store-memory.workspace = true
ssh-key = { workspace = true, features = ["ed25519", "rand_core"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
