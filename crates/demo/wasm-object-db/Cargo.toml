[package]
edition.workspace = true
license.workspace = true
name = "wasm-object-db"
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gitana-file-store-local.workspace = true
gitana-object.workspace = true
gitana-object-store.workspace = true

# Native only: the demo builds and runs on the host too (using an ambient-opened temp
# dir), which needs cap-std. On wasm the store takes a host preopen via `from_root`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std.workspace = true
tokio = { workspace = true, features = ["rt"] }
