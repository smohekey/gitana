[workspace]
members = ["crates/cli/*", "crates/core/*", "crates/demo/*", "crates/wasm/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smohekey/gitana"
rust-version = "1.96.0"

[workspace.dependencies]
anyhow = "1.0.103"
assert_cmd = "2.2.2"
axum = "0.8"
cap-std = "4.0.2"
clap = { version = "4.6.1", features = ["derive"] }
clap-mcp = "0.0.5"
flate2 = "1.1.9"
gitana-config = { path = "crates/core/gitana-config" }
gitana-diff = { path = "crates/core/gitana-diff" }
gitana-file-store = { path = "crates/core/gitana-file-store" }
gitana-file-store-conformance = { path = "crates/core/gitana-file-store-conformance" }
gitana-file-store-local = { path = "crates/core/gitana-file-store-local" }
gitana-file-store-memory = { path = "crates/core/gitana-file-store-memory" }
gitana-git-http = { path = "crates/core/gitana-git-http" }
gitana-identity = { path = "crates/core/gitana-identity" }
gitana-object = { path = "crates/core/gitana-object" }
gitana-object-store = { path = "crates/core/gitana-object-store" }
gitana-porcelain = { path = "crates/core/gitana-porcelain", default-features = false }
gitana-remote = { path = "crates/core/gitana-remote", default-features = false }
gitana-repository = { path = "crates/core/gitana-repository" }
gitana-trust = { path = "crates/core/gitana-trust" }
gitana-worktree = { path = "crates/core/gitana-worktree" }
gta-core = { path = "crates/cli/gta-core" }
gta-mcp = { path = "crates/cli/gta-mcp" }
hmac = "0.12"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.0"
ssh-key = { version = "0.6", features = ["ed25519"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.3"
wasip2 = "1.0.4"
wasmtime = "46"
wasmtime-wasi = "46"
wasmtime-wasi-http = "46"
wit-bindgen = "0.58"

[workspace.lints.rust]
unsafe_code = "forbid"
