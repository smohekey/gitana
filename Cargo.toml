[workspace]
members = ["crates/cli/*", "crates/core/*", "crates/demo/*", "crates/wasm/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smohekey/gitana"
rust-version = "1.96.0"

[workspace.dependencies]
anyhow = "1.0.103"
assert_cmd = "2.2.2"
axum = "0.8"
cap-std = "4.0.2"
clap = { version = "4.6.1", features = ["derive"] }
clap-mcp = "0.0.5"
flate2 = "1.1.9"
gitana-clone = { version = "0.1.0", path = "crates/core/gitana-clone" }
gitana-config = { version = "0.1.0", path = "crates/core/gitana-config" }
gitana-config-native = { version = "0.1.0", path = "crates/core/gitana-config-native" }
gitana-credential = { version = "0.1.0", path = "crates/core/gitana-credential" }
gitana-diff = { version = "0.1.0", path = "crates/core/gitana-diff" }
gitana-file-store = { version = "0.1.0", path = "crates/core/gitana-file-store" }
gitana-file-store-conformance = { version = "0.1.0", path = "crates/core/gitana-file-store-conformance" }
gitana-file-store-local = { version = "0.1.0", path = "crates/core/gitana-file-store-local" }
gitana-file-store-memory = { version = "0.1.0", path = "crates/core/gitana-file-store-memory" }
gitana-git-http = { version = "0.1.0", path = "crates/core/gitana-git-http" }
gitana-identity = { version = "0.1.0", path = "crates/core/gitana-identity" }
gitana-linked-worktree = { version = "0.1.0", path = "crates/core/gitana-linked-worktree" }
gitana-object = { version = "0.1.0", path = "crates/core/gitana-object" }
gitana-object-store = { version = "0.1.0", path = "crates/core/gitana-object-store" }
gitana-porcelain = { version = "0.1.0", path = "crates/core/gitana-porcelain", default-features = false }
gitana-remote = { version = "0.1.0", path = "crates/core/gitana-remote", default-features = false }
gitana-repository-layout = { version = "0.1.0", path = "crates/core/gitana-repository-layout" }
gitana-repository = { version = "0.1.0", path = "crates/core/gitana-repository" }
gitana-trust = { version = "0.1.0", path = "crates/core/gitana-trust" }
gitana-worktree = { version = "0.1.0", path = "crates/core/gitana-worktree" }
gta-core = { version = "0.1.0", path = "crates/cli/gta-core" }
gta-mcp = { version = "0.1.0", path = "crates/cli/gta-mcp" }
hmac = "0.12"
libc = "0.2"
# Pure-Rust OpenPGP (rpgp). `default-features = false` drops the bzip2 C dependency; the verify path
# needs no compression. Chosen over sequoia-openpgp for the wasm32-wasip2 build and clean-room story.
pgp = { version = "0.20.0", default-features = false }
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.0"
ssh-key = { version = "0.6", features = ["ed25519"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.3"
wasip2 = "1.0.4"
wasmtime = "46"
wasmtime-wasi = "46"
wasmtime-wasi-http = "46"
windows-sys = "0.61.2"
winx = "0.36.4"
wit-bindgen = "0.58"

[workspace.lints.rust]
unsafe_code = "forbid"
