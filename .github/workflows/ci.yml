# Build / format / lint / test gate for the workspace.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The wasm component is a workspace member; clippy on `--all-targets` needs the target.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The host integration tests build `gitana-repo-component` for wasm32-wasip2 at test time.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      # Stock `git` is the oracle for many tests; ubuntu-latest ships a recent build (with SHA-256).
      - run: git --version
      - run: cargo test --workspace

  windows-storage-durability:
    name: storage durability (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runtime coverage matters here: a cross-target check cannot establish whether Windows can
      # flush the writable directory handles used by the durability barrier.
      - run: cargo test -p gitana-file-store-local -p gitana-linked-worktree --lib

  msrv:
    name: msrv (1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
